<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SL Smart Design</title>
  <!-- SL Smart Design 10.20.1: a short message from a ribbon command (slsd.js notice). Text only; nothing is changed. -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    :root { --ink: #1f2a37; --muted: #5b6573; --brand: #1179ef; --brand-dark: #0b5fc2; --bg: #ffffff; --line: #e3e8ef; }
    @media (prefers-color-scheme: dark) { :root { --ink: #e8edf3; --muted: #aab4c0; --bg: #1e1f22; --line: #3a3d42; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 "Open Sans", "Segoe UI", Arial, sans-serif; }
    main { display: flex; flex-direction: column; height: 100%; padding: 20px 22px 16px; }
    h1 { font-size: 16px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
    h1::before { content: ""; width: 6px; height: 18px; border-radius: 3px; background: var(--brand); }
    p { margin: 0; color: var(--ink); flex: 1; overflow: auto; }
    footer { display: flex; justify-content: flex-end; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 14px; }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 6px; padding: 7px 22px; cursor: pointer; }
    button:hover { background: var(--brand-dark); }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1 id="t">SL Smart Design</h1>
    <p id="m"></p>
    <footer><button id="ok" type="button">OK</button></footer>
  </main>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('t').textContent = (q.get('t') || 'SL Smart Design').slice(0, 80);
    document.getElementById('m').textContent = (q.get('m') || '').slice(0, 600);
    const close = () => { try { Office.context.ui.messageParent('ok'); } catch (e) { window.close(); } };
    document.getElementById('ok').addEventListener('click', close);
    document.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === 'Escape') close(); });
    if (typeof Office !== 'undefined') Office.onReady(() => document.getElementById('ok').focus());
  </script>
</body>
</html>
