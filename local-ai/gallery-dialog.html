<!doctype html>
<!-- AI Visual Builder 10.16 - the large gallery: an Office dialog opened by the panel (app.js appLarge), in the spirit of
     SL Smart Design's Alternative Design popup. It shows the panel's designs large, with a big preview on hover, and
     sends the user's choice back to the panel (Office messageParent), which inserts it into PowerPoint. It reads the
     designs from the panel host with the key in its address (server.py gallery_get) and never talks to PowerPoint. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Visual Builder - designs</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root { --ink: #262626; --mute: #5f5f5f; --line: #dcdcdc; --sel: #1f6fb2; --bg: #f6f6f6; --card: #fff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; color: var(--ink); background: var(--bg); }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .count { color: var(--mute); font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .chips button { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink); }
  .chips button.sel { background: var(--sel); border-color: var(--sel); color: #fff; }
  .acts { display: flex; gap: 8px; }
  button.b { border: 1px solid #b9b9b9; background: #fff; border-radius: 4px; padding: 6px 13px; font-size: 13px; cursor: pointer; color: var(--ink); }
  button.b:hover:not(:disabled) { background: #f0f0f0; }
  button.b.primary { background: var(--sel); border-color: var(--sel); color: #fff; font-weight: 600; }
  button.b:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 2px solid transparent; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 8px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.18); }
  .card.sel { border-color: var(--sel); }
  .card .t { aspect-ratio: 1103 / 459; background: #fff; border: 1px solid #eee; border-radius: 4px; overflow: hidden; }
  .card .t svg { width: 100%; height: 100%; display: block; }
  .card .n { font-weight: 600; font-size: 14px; margin: 7px 2px 1px; }
  .card .m { font-size: 12px; color: var(--mute); margin: 0 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .tag { border-radius: 3px; padding: 0 6px; font-size: 11px; background: #e8f3e8; color: #23662a; }
  .tag.ai { background: #ece8f6; color: #4b3b8f; }
  .tag.part { background: #fdf0dc; color: #8a5a00; }
  footer { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: #fff; border-top: 1px solid var(--line); }
  #note { flex: 1; font-size: 13px; color: var(--mute); }
  #note.err { color: #a4262c; }
  .spin { width: 14px; height: 14px; border: 2px solid #c8c8c8; border-top-color: var(--sel); border-radius: 50%; display: inline-block; animation: s 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  #big { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(.98); width: min(1100px, 86vw); background: #fff; border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.28); padding: 14px; pointer-events: none; opacity: 0; transition: opacity .12s, transform .12s; z-index: 5; }
  #big.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #big .t svg { width: 100%; height: auto; display: block; }
  #big .n { font-weight: 600; font-size: 16px; margin-top: 8px; }
  #big .m { font-size: 13px; color: var(--mute); }
  .empty { color: var(--mute); padding: 40px; text-align: center; }
</style></head>
<body>
<header>
  <h1>Choose a design</h1><span class="count" id="count"></span>
  <div class="chips" id="chips"></div>
  <div class="acts"><button class="b" id="more" type="button">More visuals</button><button class="b" id="slides" type="button">Several slides</button>
    <button class="b" id="edit" type="button">Edit a visual</button><button class="b" id="close" type="button">Close</button></div>
</header>
<main><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>Loading the designs…</div></main>
<footer><span id="note"></span><button class="b primary" id="insert" type="button" disabled>Insert</button></footer>
<div id="big" role="tooltip"></div>
<script>
(() => {
  const K = new URLSearchParams(location.search).get('k') || '', $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const G = { v: -1, d: null, sel: -1, filter: 'All', hoverT: 0, open: false };
  // to the panel: Office's dialog channel; a plain browser window (preview) posts to the window that opened it, a frame
  // inside the panel (tests) to its parent
  const send = m => { const s = JSON.stringify(m);
    try { if (window.Office && Office.context && Office.context.ui && Office.context.ui.messageParent) { Office.context.ui.messageParent(s); return; } } catch (e) { /* not in Office */ }
    const to = window.opener || (window.parent !== window ? window.parent : null);
    if (to) to.postMessage({ aivbGallery: s }, location.origin); };
  if (window.Office && Office.onReady) Office.onReady(() => {});
  async function load() {
    try {
      const r = await fetch('/api/gallery?k=' + encodeURIComponent(K), { cache: 'no-store', headers: { 'X-AIVB-Client': '1' } });
      const d = await r.json();
      if (!r.ok) { $('empty').hidden = false; $('empty').textContent = d.error || 'The designs are not available.'; return; }
      if (d.v !== G.v) { G.v = d.v; G.d = d; G.sel = d.sel; render(); } else { G.d.note = d.note; G.d.busy = d.busy; G.d.err = d.err; G.d.sel = d.sel; }
      status();
    } catch (e) { $('note').textContent = 'The panel host is not answering.'; }
  }
  function render() {
    const L = G.d.items, cats = ['All'].concat([...new Set(L.map(c => c.category))]);
    if (!cats.includes(G.filter)) G.filter = 'All';
    $('count').textContent = L.length ? `${L.length} design${L.length > 1 ? 's' : ''}, best first` : '';
    $('chips').innerHTML = cats.length > 2 ? cats.map(k => `<button type="button" class="${k === G.filter ? 'sel' : ''}" data-k="${esc(k)}">${esc(k)}</button>`).join('') : '';
    $('chips').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { G.filter = b.dataset.k; render(); }));
    const shown = L.filter(c => G.filter === 'All' || c.category === G.filter);
    $('empty').hidden = !!L.length; if (!L.length) $('empty').textContent = 'No designs yet. Press Generate visuals in the panel.';
    $('grid').innerHTML = shown.map(c => `<button type="button" class="card${c.i === G.sel ? ' sel' : ''}" data-i="${c.i}" aria-pressed="${c.i === G.sel}">` +
      `<div class="t">${c.svg}</div><div class="n">${esc(c.name)}</div><div class="m">${esc(c.category)}${c.slides > 1 ? ` · ${c.slides} slides` : ''}` +
      ` <span class="tag${c.edit === 'full' ? '' : ' part'}">${c.edit === 'full' ? 'Editable' : 'Partly editable'}</span>${c.ai ? '<span class="tag ai">AI-designed</span>' : ''}</div></button>`).join('');
    $('grid').querySelectorAll('.card').forEach(b => {
      b.addEventListener('click', () => pick(+b.dataset.i));
      b.addEventListener('dblclick', () => { pick(+b.dataset.i); insert(); });
      b.addEventListener('pointerenter', e => { if (e.pointerType !== 'touch') hover(b); });
      b.addEventListener('pointerleave', unhover);
    });
    buttons();
  }
  function pick(i) { G.sel = i; document.querySelectorAll('.card').forEach(b => { const on = +b.dataset.i === i; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); }); buttons(); send({ action: 'select', i }); }
  function insert() { if (G.sel < 0 || (G.d && G.d.busy)) return; send({ action: 'insert', i: G.sel }); $('note').textContent = 'Inserting…'; }
  function hover(b) { clearTimeout(G.hoverT); G.hoverT = setTimeout(() => { const c = G.d.items.find(x => x.i === +b.dataset.i); if (!c) return;
    $('big').innerHTML = `<div class="t">${c.svg}</div><div class="n">${esc(c.name)}</div><div class="m">${esc(c.category)} · ${c.edit === 'full' ? 'every shape and text editable in PowerPoint' : 'editable shapes and text; some icons are pictures'}${c.ai ? ' · designed by AI' : ''}</div>`;
    const r = b.getBoundingClientRect(), big = $('big');
    // beside the card when there is room, so the card stays visible; else centred
    big.style.left = r.left + r.width / 2 < innerWidth / 2 ? Math.min(innerWidth - big.offsetWidth / 2 - 10, r.right + 14 + big.offsetWidth / 2) + 'px' : Math.max(big.offsetWidth / 2 + 10, r.left - 14 - big.offsetWidth / 2) + 'px';
    big.classList.add('on'); }, G.open ? 0 : 160); }
  function unhover() { clearTimeout(G.hoverT); $('big').classList.remove('on'); }
  function buttons() { const c = G.d && G.d.items.find(x => x.i === G.sel), busy = !!(G.d && G.d.busy);
    $('insert').disabled = !c || busy; $('insert').textContent = c ? `Insert “${c.name}”` : 'Insert'; $('more').disabled = busy || !(G.d && G.d.items.length); }
  function status() { const d = G.d; if (!d) return; $('note').innerHTML = (d.busy ? '<span class="spin"></span>' : '') + esc(d.note || (d.items.length ? 'Rest the pointer on a design to see it large. Double-click to insert it.' : ''));
    $('note').classList.toggle('err', !!d.err); buttons(); }
  $('insert').addEventListener('click', insert);
  $('more').addEventListener('click', () => { send({ action: 'more' }); $('note').textContent = 'Designing more visuals…'; });
  $('slides').addEventListener('click', () => send({ action: 'slides' }));
  $('edit').addEventListener('click', () => send({ action: 'edit' }));
  $('close').addEventListener('click', () => send({ action: 'close' }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') unhover(); if (e.key === 'Enter' && G.sel >= 0) insert(); });
  addEventListener('scroll', unhover, true);
  load(); setInterval(load, 1000);
})();
</script>
</body></html>
