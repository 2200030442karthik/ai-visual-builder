     design of 3 Nov and the samples, never calls an AI provider, and writes JSON into <pre id="out">; #evidence holds
     the previews for the screenshot (tests/run_tests.py). -->
<html><head><meta charset="utf-8"><title>V10.12 studio tests</title><script src="/tests/samples.js"></script><script src="/tests/mock.js"></script>
<style>body{font:12px Segoe UI,Arial} #evidence{display:grid;grid-template-columns:repeat(4,300px);gap:8px;width:1240px} #evidence div{border:1px solid #ccc;padding:3px} #evidence svg{width:100%;height:auto;display:block} h3{grid-column:1/-1;margin:8px 0 0}</style></head>
<body><iframe id="f" src="/v10.html" style="width:420px;height:900px"></iframe><pre id="out">running</pre><div id="evidence"></div>
<script>

    const da = ev('(P, R) => planAtDensity(P, R, "auto")')(longP, R), df = ev('(P, R) => planMoreDesigns(P, R, new Set(), 4)')(longP, R);

    // negative: no content and no saved plan -> nothing drawn, said; another layout -> nothing inserted

    await S.showDesigns(false);
    res.d.emptyMsg = status().slice(0, 120); res.d.emptyDesigns = S.ST.designs.length;
    d.getElementById('content').value = DE; S.studioFillSources('text'); await S.showDesigns(false);
    await gateNow('Title Slide');
    const before = leaves(M.slides[0]).length; S.ST.sel = 0; await S.insertDesign();
    res.d.gateRefused = leaves(M.slides[0]).length === before;
    await gateNow('Content_Slide');
    res.d.ai = W.__ai.length;
  }

  /* ===== milestone 2: edit an inserted visual ===== */
  {
    M.reset(); M.realGroups = true; await gateNow('Content_Slide');

    const note = sl.shapes.addTextBox('Presenter reminder', { left: 20, top: 650, width: 220, height: 40 });
    W.localStorage.clear();
    S.savePlan(plan, 'Claude AI result (request test)'); S.studioFillSources(); d.getElementById('stPlan').selectedIndex = 1; S.ST.seen = new W.Set();
    d.getElementById('stDensity').value = 'auto';

    const D0 = S.ST.designs[S.ST.sel];
    await S.insertDesign();
    const vis = () => leaves(sl).filter(x => tagOf(x, 'AIVB_V')), id0 = tagOf(vis()[0], 'AIVB_V');
    const ids0 = sl.items.map(x => x.id), beforePrims = D0.r.prims;

    await S.editLoad();
    const E = S.ST.edit;
    res.e.load = { ok: !!E, kind: E && E.rec.kind, rows: d.querySelectorAll('#stEditForm .edrow').length, hand: E ? E.hand.map(x => x.to) : [], status: status().slice(0, 160),

    const ic = d.querySelector('#stEditForm .edrow[data-k="2"] .edI'); const icon0 = ic.value; ic.value = icon0 === 'database' ? 'server' : 'database';

    const tOpen = S.editTarget(), openFits = ev('(P, k, R) => planRender(P, k, R).ok')(tOpen.plan, tOpen.layout, S.ST.edit.rec.rect);

    res.e.openFits = openFits;
    const pvOK = S.editPreview();
    await S.editApply();

      noteUntouched: sl.items.includes(note) && note.textFrame.textRange.text === 'Presenter reminder', titleUntouched: sl.items.find(x => x.name === 'Title 1').textFrame.textRange.text === 'Data engineering platform',
      oldShapesGone: ids0.filter(x => !sl.items.some(y => y.id === x)).length, onlyVisualReplaced: sl.items.filter(x => !tagOf(x, 'AIVB_V')).every(x => ids0.includes(x.id)) };
    shot('2. Edit: before (left) and after (right): text, icon, colours, spacing; the hand edit kept', [['before: ' + D0.r.name, beforePrims], ['after', ev('(P, k, R) => planRender(P, k, R).prims')(Object.assign({}, rec1.plan, { style: rec1.style }), rec1.layout, rec1.rect)]]);
    // another layout
    M.selShapes = [vis()[0]]; await S.editLoad();
    const ls = d.getElementById('stEdLayout'), other = [...ls.options].find(o => o.value !== S.ST.edit.rec.layout && !/does not fit/.test(o.textContent));

    await S.editApply();
    const rec2 = W.JSON.parse(ev(`localStorage.getItem('aivb.rec.AIVB_R_${id0}')`));

    const rec4 = W.JSON.parse(ev(`localStorage.getItem('aivb.rec.AIVB_R_${id0}')`));
    res.e.undo = { back: rec3 && rec3.layout === rec1.layout, redo: rec4 && rec4.layout === rec2.layout, status: status().slice(0, 120) };

    const blocker = sl.shapes.addGeometricShape('Rectangle', { left: 500, top: 330, width: 120, height: 60 }), idsB = sl.items.map(x => x.id).join();

  /* ===== milestone 3: several slides ===== */

    // each part drawn in every numbered layout that fits it: the first number is the part's first step
    const body = sq.parts.filter(q => !q.overview), numbered = q => Object.keys(ev('PLAN_LAYOUTS')).map(k => ev('(P, k, R) => planRender(P, k, R)')(q, k, R)).filter(r => r.ok)

    const nums = body.map(q => (numbered(q)[0] || []));
    res.s.sequence = { parts: sq.parts.map(q => `${q.title} [${q.items.length}, from ${q.start + 1}]`), how: sq.how, missing: ev('planCoverage')(seq, sqR), numbers: nums.map(a => a.join(',')),
      continued: nums.length >= 2 && nums.every((a, k) => a.length && Math.min(...a) === body[k].start + 1 && Math.max(...a) === body[k].start + body[k].items.length) };

    res.s.rollback = { status: status().slice(0, 160), slides: M.slides.length === nB, batchTag: M.presTags.getItemOrNullObject('AIVB_BATCH').isNullObject };

    await ev('PowerPoint.run(async c => { c.presentation.slides.add({}); c.presentation.slides.add({}); })');
    M.slides.slice(-2).forEach(s => s.tags.add('AIVB_BATCH', 'BTEST'));
    const nR = M.slides.length;
    await S.checkBatch();
    const shown = !d.getElementById('stRecover').hidden;
    await S.recoverBatch();
    res.s.recover = { offered: shown, removed: nR - M.slides.length, keptFirst: M.slides[0] === sel0 || M.slides.length >= 1, cleared: M.presTags.getItemOrNullObject('AIVB_BATCH').isNullObject, status: status().slice(0, 120) };
    res.s.ai = W.__ai.length;
  }

  const A = res.acceptance = [
