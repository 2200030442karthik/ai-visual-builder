<!doctype html>
<!-- V10.9 acceptance harness. Loads the real panel (v10.html + gallery.js) in an iframe, replaces PowerPoint with a strict
     stand-in that refuses what PowerPoint refuses (InvalidArgument at sync, keeping the shapes queued before it, like the
     real batch), runs every sample through analysis, the gallery and insertion, and writes JSON into <pre id="out">.
     Run:  python server.py --http --test --port 44398   then   msedge --headless --dump-dom http://localhost:44398/tests/harness.html
     (tests/run_tests.py does both). -->
<html><head><meta charset="utf-8"><title>V10.9 harness</title><script src="/tests/samples.js"></script><script src="/tests/mock.js"></script></head>
<body><iframe id="f" src="/v10.html" style="width:420px;height:900px"></iframe><pre id="out">running</pre>
<script>
const out = document.getElementById('out'), errors = [];
const CASES = [
  ['ml_lifecycle_7', 'ML lifecycle (7 stages)', { n: 7, ordered: true }],
  ['ml_lifecycle_7_desc', 'ML lifecycle (7 stages, descriptions)', { n: 7, ordered: true }],
  ['ml_apps_6', 'ML applications (6)', { n: 6 }],
  ['ml_workflow_4', 'ML workflow (4 steps)', { n: 4, ordered: true }],
  ['ml_workflow_arrows', 'ML workflow (4 steps, arrows)', { n: 4, ordered: true }],
  ['preprocessing', 'Data preprocessing', { n: 4, ordered: true }],
  ['two_points', 'Two points: PM priorities', { n: 2 }],
  ['pm_workflow_prose', 'Project management workflow', {}],
  ['ml_training_prose', 'Machine learning training', {}],
  ['supervised_vs', 'Supervised vs unsupervised', {}],
  ['scores', 'Project scores', { data: ['95', '78', '62', '89', '84'] }],
  ['special', 'Special characters and formulas', { tokens: ['V10_TEST_2026', 'A&B', '100%', '₹5,499.50', '#Automation', 'user@example.com'] }],
  ['table', 'Project records (table)', { data: ['1001', '95', 'Alpha Project'] }],
  ['long_doc', 'Long document with 9 sections', {}],
  ['claude', 'Claude statement', { relation: ['Anthropic', 'developed', 'Claude', 'AI model'], min: 3, max: 6 }],
  ['claude_active', 'Claude statement (active)', { relation: ['Anthropic', 'developed', 'Claude', 'AI model'], min: 3, max: 6 }],
  ['definition', 'Definition statement', { min: 2, max: 6 }],
  ['arch_sentence', 'Cloud architecture (sentence)', { n: 4, ordered: true }],
  ['powerbi', 'Power BI content types', { n: 6, distinctIcons: true, min: 10, max: 25 }],
  ['ml5_intro', 'ML workflow (5 stages, intro)', { n: 5, distinctIcons: true }],
  ['ml5_title', 'ML workflow (5 stages, title line)', { n: 5 }],
  ['ml5_arrows', 'ML workflow (5 stages, intro and arrows)', { n: 5 }],
  ['mixed', 'Mixed content', { n: 5 }],
  ['powerbi_intro', 'Power BI types (intro)', { n: 6 }],
  ['paragraph', 'Explanatory paragraph', {}],
  ['genai_sentence', 'Generative AI (sentence)', { n: 5, unordered: true, labels: ['Text', 'Images', 'Music', 'Videos', 'Computer code'] }],
  ['genai_paragraph', 'Generative AI (paragraph)', { n: 5, unordered: true, labels: ['Text', 'Images', 'Music', 'Videos', 'Code'] }],
  ['genai_list', 'Generative AI (list)', { n: 5, thumbs: true, unordered: true, labels: ['Text', 'Images', 'Music', 'Videos', 'Code'] }],
  ['edu', 'Educational content', { n: 5, minA: 6, notConcept: 'Education-focused' }],
  ['edu_plain', 'Educational content (plain)', { n: 5, minA: 6, notConcept: 'Education-focused' }],
  ['facts', 'Quick facts', { n: 4, unorderedOnly: true, iconKeys: ['cloud', 'fingerprint', 'globe', 'bowl'] }],
  ['record', 'Automation validation report', { tokens: ['V10_TEST_2026', 'R&D', '100%', '₹5,499.50', 'automation@example.com', '#Automation', 'Total Cost = Quantity × Unit Price', 'IF(Status = "Completed", "Pass", "Review")'] }],
  ['gibberish', 'Meaningless text', { reject: true }],
];
const APPROVED = ['#8ECDB7', '#62B7E4', '#7EA2C8', '#9B99C7', '#DDB945', '#E6A157', '#E58F6D', '#B88968', '#D98CA1', '#C1A5C6', '#FFFFFF', '#F2F2F2', '#D9D9D9', '#7F7F7F', '#404040'];

/* A Napkin-like SVG with every case the converter handles: background, rounded rect with gradient and shadow, multi-line
   text in a small font, a curved icon group, circle, arrow line, triangle, rectangle path, open path, external picture,
   and a script plus an onload handler that must never run. */
const TEST_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" onload="window.__pwned=1"><script>window.__pwned=2<\/script>
<defs><linearGradient id="gr"><stop offset="0" stop-color="#3366ff"/><stop offset="1" stop-color="#ff0000"/></linearGradient><filter id="sh"><feDropShadow dx="2" dy="2"/></filter>
<marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#777"/></marker>
<style>.lbl{font-family:Inter;font-size:14px;fill:#222}</style></defs>
<rect width="800" height="400" fill="#ffffff"/>
<g id="step1"><rect x="20" y="40" width="220" height="120" rx="16" fill="url(#gr)" filter="url(#sh)"/>
<text class="lbl" x="130" y="100" text-anchor="middle"><tspan x="130" y="95">Data</tspan><tspan x="130" dy="18">collection</tspan></text>
<g class="icon"><path d="M40 60 C 50 50, 60 50, 70 60 S 90 70, 100 60" stroke="#123456" fill="none"/><path d="M45 70 Q 60 90 75 70 Z" fill="#ff8800"/></g></g>
<g id="step2"><circle cx="400" cy="100" r="60" fill="#8ecdb7"/><text x="400" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#333">Model training</text></g>
<g id="links"><line x1="240" y1="100" x2="330" y2="100" stroke="#777" stroke-width="3" marker-end="url(#m)"/><polygon points="500,40 560,160 440,160" fill="#E6A157"/>
<path d="M600 40 L700 40 L700 160 L600 160 Z" fill="#62B7E4"/><path d="M600 200 L650 260 L700 200" stroke="#555" fill="none"/></g>
<image href="https://example.com/x.png" x="0" y="300" width="50" height="50"/>
<text x="20" y="380" font-size="12">Evaluation</text></svg>`;
async function run() {
  const F = document.getElementById('f'), W = F.contentWindow, ev = x => W.eval(x);
  W.addEventListener('error', e => errors.push(String(e.message)));
  for (let i = 0; i < 100 && !(ev("typeof suggest === 'function' && typeof analyseContent === 'function'")); i++) await new Promise(r => setTimeout(r, 100));
  if (!ev("typeof analyseContent === 'function'")) {
    const html = await (await fetch('/v10.html')).text(), js = [...html.matchAll(/<script(?: id="\w+")?>([\s\S]*?)<\/script>/g)].map(m => m[1]);
    js.push(await (await fetch('/gallery.js')).text());
    const syntax = js.map((c, i) => { try { new Function(c); return null; } catch (e) { return `script ${i}: ${e.message}`; } }).filter(Boolean);
    throw new Error('panel did not start; syntax: ' + JSON.stringify(syntax) + ' runtime: ' + JSON.stringify(W.__errs) + ' frame: ' + F.contentWindow.location.href + ' / ' + F.contentDocument.title + ' / ' + F.contentDocument.body.innerHTML.length);
  }
  installMock(W);
  ev("state.inOffice = true; state.canGroup = true; state.canRotate = true; 1");
  const res = { panel: { lines: ev("document.documentElement.outerHTML.split('\\n').length"), examplesUI: !!W.document.getElementById('examples'),
    aiUI: ['dotOllama', 'genImage', 'textModel', 'simplify', 'briefBox'].filter(id => W.document.getElementById(id)),
    napkin: { panel: !!W.document.getElementById('napkinPanel'), controlsHidden: W.document.getElementById('napkinControls').hidden, info: W.document.getElementById('napkinInfo').textContent } }, cases: [], faults: [], errors };
  const samples = Object.fromEntries(EXAMPLES);
  // Access gate (the panel host's policy from AIVB_ACCESS, set by run_tests.py) and the slide layout read from PowerPoint
  const d0 = W.document, gate = res.gate = {};
  const gateNow = async layout => { W.__mock.layoutName = layout; await ev('checkSlide()'); ev('showGate(); updateButtons(); 1'); };
  await ev('refreshStatus()');
  d0.getElementById('content').value = samples['ML workflow (5 stages, intro)'];
  await gateNow('Content_Slide');
  gate.contentSlide = { user: ev('access().user'), authorized: ev('userOK()'), analyseEnabled: !d0.getElementById('analyse').disabled, msg: d0.getElementById('gateMsg').hidden ? '' : d0.getElementById('gateMsg').textContent };
  await gateNow('Title Slide');
  gate.otherLayout = { analyseEnabled: !d0.getElementById('analyse').disabled, msg: d0.getElementById('gateMsg').textContent };
  ev('state.sections = []; 1'); await ev('analyseContent()');
  Object.assign(gate.otherLayout, { sectionsAfterAnalyse: ev('state.sections.length'), status: d0.getElementById('status').textContent.slice(0, 120) });
  W.__mock.lookAlike = true; await gateNow('Content_Slide');
  gate.lookAlike = { analyseEnabled: !d0.getElementById('analyse').disabled, msg: d0.getElementById('gateMsg').textContent };
  W.__mock.lookAlike = false; W.__mock.imported0 = true; await gateNow('Content_Slide');
  gate.importedEmptyLayout = { analyseEnabled: !d0.getElementById('analyse').disabled, msg: d0.getElementById('gateMsg').textContent };
  W.__mock.imported0 = false; await gateNow('Content_Slide');
  for (const [id, name, exp] of CASES) {
    const r = { id, name };
    document.title = 'case: ' + id;
    try {
      W.document.getElementById('content').value = samples[name];
      const t0 = performance.now();
      await ev('analyseContent()');
      if (exp.reject) {
        Object.assign(r, { rejected: ev('state.sections.length') === 0, message: W.document.getElementById('status').textContent, step3Hidden: W.document.getElementById('step3').hidden,
          galleryHidden: W.document.getElementById('gallery').hidden, insertDisabled: W.document.getElementById('insert').disabled, A: 0, B: 0, C: 0, inserts: { ok: 0, failed: [], skippedShapes: 0 }, ms: 0 });
        r.rejectOK = r.rejected && r.message === 'The content could not be understood. Please enter meaningful text.' && r.step3Hidden && r.insertDisabled;
        res.cases.push(r);
        continue;
      }
      const secs = ev("state.sections.map(s => ({ heading: s.heading, status: s.status, source: s.model && s.model.source, type: s.model && s.model.type }))");
      r.sections = secs.length; r.sources = [...new Set(secs.map(s => s.source))];
      ev("selectSection(state.sections.findIndex(s => s.status === 'ready' && s.model.type !== 'none'))");
      const g = ev(`(() => { const s = state.sec; s.gallery = null; const G = suggest(s), sc = G.scene || {}, items = sc.items || [];
        const rep = G.list.map(c => { const all = c.prims.filter(p => p.text).map(p => String(p.text)).join('\\n');
          return { key: c.key, name: c.name, engine: c.engine, edit: c.edit, missing: items.filter(it => !all.includes(it.label)).map(it => it.label), objects: c.objects }; });
        const AP = new Set(${JSON.stringify(APPROVED)});
        const flat = ps => ps.flatMap(p => p.t === 'table' ? [p].concat(p.cells) : [p]);
        const brand = G.list.map(c => { const ps = flat(c.prims).filter(p => p.t !== 'image');
          return { name: c.name, colors: [...new Set(ps.flatMap(p => [p.fill, p.line, p.color]).filter(v => v && !AP.has(v)))], small: ps.filter(p => (p.text || p.t === 'table') && !(p.size >= 22)).length,
            outlineIcons: ps.filter(p => p.grp && p.t === 'shape' && !p.fill).length }; }).filter(b => b.colors.length || b.small || b.outlineIcons);
        const m = s.model;
        return { brand, type: m.type, relation: m.relation ? [m.relation.a.label, m.relation.verb, m.relation.b && m.relation.b.label, m.relation.b && m.relation.b.role] : null, ms: G.ms, n: sc.n, mode: sc.mode, ordered: !!sc.ordered, items: items.map(i => i.label), icons: (sc.icons || []).map(i => i && i.matched ? i.key : '-'), list: rep, dropped: (G.dropped || []).length, droppedB: (G.dropped || []).filter(d => /^(Object scene|Platform|Illustrated|Topic object|Dashboard|System scene|Neural)/.test(d)),
                 allText: G.list.map(c => c.prims.filter(p => p.text).map(p => p.text).join(' ')).join(' ') }; })()`);
      r.brand = g.brand; r.type = g.type; r.relation = g.relation;
      if (exp.relation) r.relationOK = JSON.stringify(g.relation) === JSON.stringify(exp.relation);
      if (exp.min != null) r.countOK = g.list.length >= exp.min && g.list.length <= exp.max;
      r.ms = Math.round((performance.now() - t0) * 10) / 10; r.n = g.n; r.mode = g.mode; r.ordered = g.ordered; r.items = g.items; r.icons = g.icons;
      r.A = g.list.filter(c => c.engine === 'A').length; r.B = g.list.filter(c => c.engine === 'B').length; r.C = g.list.filter(c => c.engine === 'C').length;
      r.missing = g.list.filter(c => c.missing.length).map(c => c.name + ': ' + c.missing.join(', '));
      r.names = g.list.map(c => `${c.engine}:${c.name}`);
      r.droppedB = g.droppedB; r.objects = [...new Set(g.list.flatMap(c => c.objects || []))];
      if (exp.tokens) r.tokensMissing = exp.tokens.filter(t => !g.allText.includes(t));
      if (exp.data) r.dataMissing = exp.data.filter(t => !g.allText.includes(t));
      if (exp.n != null) r.nOK = g.n === exp.n;
      if (exp.distinctIcons) r.iconsOK = g.icons.every(k => k !== '-') && new Set(g.icons).size === g.icons.length;
      // independent categories: the exact labels, no stated order, no step/flow layouts
      if (exp.thumbs) r.thumbs = ev("(() => suggest(state.sec).list.slice(0, 8).map(c => ({ name: c.name, svg: thumb(c.prims) })))()");
      if (exp.unordered) r.clauseIn = ev("suggest(state.sec).list.filter(c => c.prims.some(p => /when you ask/i.test(String(p.text || '')))).map(c => c.name)");
      if (exp.unordered) { r.labels = g.items; r.unorderedOK = !r.clauseIn.length && !g.ordered && JSON.stringify(g.items) === JSON.stringify(exp.labels) && !g.list.some(c => /step|process|flow|chevron|timeline|stair|arrow|path|snake/i.test(c.name)); }
      if (exp.minA) r.variety = { A: r.A, B: r.B, families: new Set(g.list.map(c => c.name)).size, ok: r.A >= exp.minA };
      if (exp.notConcept) r.noFalseConcept = !g.items.some(t => t.includes(exp.notConcept));
      if (exp.unorderedOnly) r.unorderedOK = !g.ordered && !g.list.some(c => /step|process|flow|chevron|timeline|stair|arrow|path|snake|numbered/i.test(c.name));
      if (exp.iconKeys) r.iconsOK = JSON.stringify(g.icons) === JSON.stringify(exp.iconKeys);
      if (exp.ordered) r.orderOK = g.ordered && JSON.stringify(g.items) === JSON.stringify(g.items.slice());
      // insert every suggestion through the strict stand-in; each must go in completely, with nothing refused
      r.inserts = { ok: 0, failed: [], skippedShapes: 0 };
      for (const c of g.list) {
        W.__mock.reset();
        ev(`(() => { const s = state.sec; s.choice = null; s.want = ''; const c = ${JSON.stringify({ key: c.key })}; const card = suggest(s).list.find(x => x.key === c.key);
             if (card.base) { s.want = card.key; } else { s.choice = card.key; } s.reviewed = true; buildPreview(); return 1; })()`);
        await ev('insertVisual()');
        const st = W.document.getElementById('status').textContent;
        if (/^Done!/.test(st) && W.__mock.added() > 0) { r.inserts.ok++; r.inserts.skippedShapes += (ev('state.lastSkipped') || []).length; r.inserts.fontBad = (r.inserts.fontBad || 0) + W.__mock.fontBad(); }
        else r.inserts.failed.push(c.name + ': ' + st.slice(0, 160));
      }
    } catch (e) { r.error = String(e && e.stack || e); }
    res.cases.push(r);
  }
  // Fault injection: PowerPoint refuses one preset (decorative) -> visual still goes in, without it; refuses every font
  // name (text) -> nothing is left on the slide.
  try {
    W.document.getElementById('content').value = samples['ML applications (6)'];
    await ev('analyseContent()');
    const key = ev("(() => { const L = suggest(state.sec).list.filter(c => c.engine === 'B'); const s = state.sec; s.choice = L[0].key; s.want = ''; s.reviewed = true; buildPreview(); return L[0].name; })()");
    W.__mock.reset(); W.__mock.reject = 'Ellipse';
    await ev('insertVisual()');
    res.faults.push({ test: 'refuse Ellipse in ' + key, status: W.document.getElementById('status').textContent.slice(0, 200), shapesLeft: W.__mock.added(), skipped: (ev('state.lastSkipped') || []).length });
    W.__mock.reset(); W.__mock.reject = 'font';
    await ev('insertVisual()');
    res.faults.push({ test: 'refuse all text in ' + key, status: W.document.getElementById('status').textContent.slice(0, 200), shapesLeft: W.__mock.added() });
    W.__mock.reset(); W.__mock.reject = 'font';
    ev("document.getElementById('newSlide').checked = true");
    await ev('insertVisual()');
    res.faults.push({ test: 'refuse all text, new slide', slidesLeft: W.__mock.slides.length, shapesLeft: W.__mock.added() });
    ev("document.getElementById('newSlide').checked = false");
  } catch (e) { res.faults.push({ error: String(e && e.stack || e) }); }
  // Long descriptions: the overview keeps the names, every description goes in full on continuation (detail) slides
  try {
    W.document.getElementById('content').value = samples['ML lifecycle (7 stages, descriptions)'];
    await ev('analyseContent()');
    const pick = ev("(() => { const s = state.sec, c = suggest(s).list.find(x => !x.base && x.hidden > 0); s.choice = c.key; s.want = ''; s.reviewed = true; buildPreview(); return c.name; })()");
    W.__mock.reset(); W.document.getElementById('detailSlides').checked = true;
    await ev('insertVisual()');
    const all = W.__mock.slides.flatMap(sl => sl.items).map(x => String(x.textFrame && x.textFrame.textRange.text || '')).join('\n');
    const details = ev("state.sec.scene.items.map(i => i.detail)");
    res.continuation = { layout: pick, slides: W.__mock.slides.length, detailsInFull: details.filter(t => all.includes(t)).length, of: details.length,
      status: W.document.getElementById('status').textContent.slice(0, 160) };
  } catch (e) { res.continuation = { error: String(e && e.stack || e) }; }
  // Content quality: valid inputs of every kind pass, nonsense is rejected (server.py is checked on the same lists by test_server.py)
  res.quality = { validRejected: QUALITY_VALID.filter(t => !W.contentQuality(t).ok), invalidAccepted: QUALITY_INVALID.filter(t => W.contentQuality(t).ok) };

  // SVG -> native shapes: every supported element becomes a native object; scripts and handlers never run
  try {
    const conv = ev(`(() => { const c = svgToPrims(${JSON.stringify(TEST_SVG)}, Object.assign({}, TEMPLATE.contentArea)), P = c.prims;
      return { report: c.report, kinds: P.map(p => p.t === 'shape' ? p.g + (p.rot ? '@' + Math.round(p.rot) : '') : p.t), texts: P.filter(p => p.t === 'text').map(p => [p.text, p.size, p.align]),
        colors: [...new Set(P.flatMap(p => [p.fill, p.line, p.color]).filter(Boolean))], groups: [...new Set(P.map(p => p.grp).filter(Boolean))].length,
        pwned: window.__pwned || 0, outside: checkLayout(P, TEMPLATE.contentArea).filter(i => /outside/.test(i)) }; })()`);
    conv.badColors = conv.colors.filter(c => !APPROVED.includes(c));
    conv.small = conv.texts.filter(t => t[1] < 22).length;
    res.svg = conv;
  } catch (e) { res.svg = { error: String(e && e.stack || e) }; }

  // Napkin with a stand-in Napkin (no network, no credits): one approved style, 1 or 4 variations, checks, insertion
  res.napkin = [];
  const STYLE = 'EHH64S9R64R64C9DCMSKCSHD6GTPADHDC4SKJC1D68WP6CK66DJ32RV4CGVG';
  const WORKFLOW = 'Machine learning workflow\n\n1. Data collection\n2. Model training\n3. Evaluation\n4. Deployment';
  const STEPS = ['Data collection', 'Model training', 'Evaluation', 'Deployment'];
  // a clean design: four boxes in a row, each label inside its box; v shifts the layout so each variation differs
  const cleanSvg = v => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 ${400 + v * 40}">` + STEPS.map((t, i) =>
    `<rect x="${20 + i * 245}" y="${140 + v * 20}" width="215" height="${120 + v * 10}" rx="12" fill="#62B7E4"/><text x="${127 + i * 245}" y="${205 + v * 25}" text-anchor="middle" font-size="20">${t}</text>`).join('') + '</svg>';
  // like the rejected screenshots: overlapping circles, labels over each other and over a connector, a big decorative tree
  const brokenSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500"><circle cx="380" cy="250" r="140" fill="none" stroke="#9b99c7" stroke-width="2"/><circle cx="520" cy="250" r="140" fill="none" stroke="#e6a157" stroke-width="2"/>
    <g><path d="M450 60 C 300 80, 300 200, 450 220 C 600 200, 600 80, 450 60 Z" fill="#333"/><path d="M440 220 L460 220 L470 420 L430 420 Z" fill="#333"/></g>
    <line x1="100" y1="300" x2="800" y2="300" stroke="#777" stroke-width="2"/>` + STEPS.map((t, i) => `<text x="${150 + i * 40}" y="${300 + i * 6}" font-size="16">${t}</text>`).join('') + '</svg>';
  const NS = 'xmlns:p="http://schemas.openxmlformats.org/presentationml/2006/main" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"';
  // Laid out like Napkin's PowerPoint export (4:3): an optional heading (larger), a row of coloured badges, each with a
  // white icon inside and its label (Inter, 15 pt) below. v varies the spacing (different layouts).
  const EM = v => Math.round(v * 12700), COLS = ['7EA2C8', '62B7E4', '8ECDB7', 'B8C67A', 'DDB945', 'E6A157'];
  const tbox = (x, y, w, h, t, sz, extra) => `<p:sp><p:nvSpPr><p:cNvPr id="${Math.floor(Math.random() * 1e6)}" name="TextBox"/><p:cNvSpPr txBox="1"/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${EM(x)}" y="${EM(y)}"/><a:ext cx="${EM(w)}" cy="${EM(h)}"/></a:xfrm><a:prstGeom prst="rect"/><a:noFill/></p:spPr><p:txBody><a:bodyPr wrap="square"/><a:p><a:pPr algn="ctr"/><a:r><a:rPr sz="${sz * 100}"${extra || ''}><a:latin typeface="Inter"/></a:rPr><a:t>${t}</a:t></a:r></a:p></p:txBody></p:sp>`;
  const shape = (x, y, w, h, fill, prst) => `<p:sp><p:nvSpPr><p:cNvPr id="${Math.floor(Math.random() * 1e6)}" name="s"/><p:cNvSpPr/><p:nvPr/></p:nvSpPr><p:spPr><a:xfrm><a:off x="${EM(x)}" y="${EM(y)}"/><a:ext cx="${EM(w)}" cy="${EM(h)}"/></a:xfrm><a:prstGeom prst="${prst || 'roundRect'}"/><a:solidFill><a:srgbClr val="${fill}"/></a:solidFill></p:spPr></p:sp>`;
  const napkinLike = (title, labels, v, slides) => { v = v || 0;
    const step = 112 + v * 4, x0 = (720 - step * labels.length) / 2 + 30, sh = (title ? tbox(160, 120, 400, 40, title, 22, ' b="1"') : '') +
